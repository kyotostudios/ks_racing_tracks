name: Import circuit tracks

on:
  push:
    branches:
      - feat/import-circuit-tracks
    paths:
      - ".bootstrap/**"
      - ".github/workflows/import-circuit-tracks.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand and validate tracks
        run: python .bootstrap/import_tracks.py

      - name: Commit generated tracks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: import 86 circuit tracks"
          git push
